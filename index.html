</style></head><body><main><header><div><h1>Kalorien</h1></div><span style="font-size:28px">🍏</span></header><section id="today"><div class="card"><div class="row"><button id="prev" aria-label="Vorheriger Tag">‹</button><input type="date" id="date" aria-label="Datum"><button id="next" aria-label="Nächster Tag">›</button></div><div class="muted">Aufgenommen</div><div class="total"><span id="total">0</span> <small>kcal</small></div><div class="progress"><div class="fill" id="fill"></div></div><div class="row"><span id="status" class="good" role="status"></span><span class="muted" id="remaining"></span></div></div><div class="card"><h2>Mahlzeiten</h2><div id="meals"></div></div><div class="card"><div class="habit-head"><h2>Meine Tagesziele</h2><button type="button" id="editHabits" class="small-action" aria-expanded="false" aria-controls="habitSettings">Bearbeiten</button></div><div class="habit-list" id="habitChecks"></div><div id="habitSettings" class="hidden habit-settings"><div id="habitEditor"></div><button type="button" id="addHabit" class="small-action">+ Ziel hinzufügen</button></div></div><div class="card"><h2>Tagesziel</h2><div class="row"><label for="goal">Kalorienziel</label><input id="goal" type="number" min="1" step="1" inputmode="numeric" aria-label="Kalorienziel"></div></div><div class="card"><h2>Lokale Datensicherung</h2><div class="actions"><button id="backupToday" type="button">↓ Sicherung erstellen</button><button id="restoreToday" type="button">↑ Wiederherstellen</button><input type="file" accept="application/json,.json" id="importFile" class="hidden"></div></div><div class="card"><h2>Kalorien schätzen <span class="ai-badge">KI</span></h2><form id="foodSearch" class="food-search"><input id="foodQuery" type="search" maxlength="180" placeholder="z. B. Lasagne 300 g" aria-label="Gericht suchen" required><button id="foodSubmit" type="submit">Schätzen</button></form><div id="foodResult" class="food-result hidden" role="status" aria-live="polite"></div><details class="ai-settings"><summary>KI einrichten</summary><label for="aiKey">Gemini API-Schlüssel</label><div class="ai-key-row"><input id="aiKey" type="password" autocomplete="off" placeholder="API-Schlüssel" aria-label="Gemini API-Schlüssel"><button type="button" id="clearAiKey" class="small-action">Löschen</button></div><div class="subtle">Schlüssel nur für diese Sitzung. Keine Speicherung im Backup.</div></details></div></section><section id="history" class="hidden"><div class="card"><h2>Verlauf</h2><div class="actions"><button id="week" class="active">Letzte 7 Tage</button><button id="month">Letzte 30 Tage</button></div><div class="chart-scroll" id="chartScroll"><svg class="chart" id="chart" role="img" aria-label="Kalorienverlauf"></svg></div><div id="averageCard" class="average-card good" role="status" aria-live="polite"><div id="averageLabel" class="average-label"></div><div class="average-value"><span id="averageValue">0</span> <small>kcal / Tag</small></div><div id="averageDetail" class="average-detail"></div></div></div><div class="card" id="habitStatsSection"><h2>Meine Tagesziele im Verlauf</h2><div class="habit-stats" id="habitStats"></div></div></section></main><nav class="tabs" aria-label="Navigation"><div><button id="tabToday" class="active">Heute</button><button id="tabHistory">Statistik</button></div></nav><script>
const mealColors=['#f1b95e','#5b9dd6','#8d7ac7','#df8c9e'];const KEY='kalorien-tagebuch-v1',labels=['Frühstück','Mittagessen','Abendessen','Snacks'];let state;try{state=JSON.parse(localStorage.getItem(KEY))||{}}catch{state={}}if(!state.days||typeof state.days!=='object')state.days={};if(!Number.isFinite(Number(state.goal))||Number(state.goal)<=0)state.goal=2000;
const defaultHabits=[{id:'softdrink',name:'Kein Softdrink',enabled:true},{id:'sweets',name:'Keine Süßigkeiten',enabled:true},{id:'coffee',name:'Kein Kaffee',enabled:true}];
function cleanHabitConfig(raw){const seen=new Set();const out=[];for(const h of Array.isArray(raw)?raw:defaultHabits){if(!h||typeof h.id!=='string'||!(/^[a-z0-9_-]{1,40}$/i).test(h.id)||seen.has(h.id))continue;const name=String(h.name||'').trim().slice(0,45);if(!name)continue;out.push({id:h.id,name,enabled:h.enabled!==false});seen.add(h.id);if(out.length>=12)break}return out}
state.habitConfig=cleanHabitConfig(state.habitConfig);
const visibleHabits=()=>state.habitConfig.filter(h=>h.enabled);
const $=id=>document.getElementById(id);const fmt=n=>Math.round(n).toLocaleString('de-DE');function iso(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function parse(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d,12)}let chosen=iso(new Date()),period=7;function save(){localStorage.setItem(KEY,JSON.stringify(state))}function day(s){return state.days[s]||{}}function sum(s){return labels.reduce((n,k)=>n+(Number(day(s)[k])||0),0)}function drawHabits(){
 const container=$('habitChecks');container.replaceChildren();
 const shown=visibleHabits();
 if(!shown.length){const note=document.createElement('span');note.className='subtle';note.textContent='Keine Tagesziele eingeblendet';container.append(note)}
 shown.forEach(({id,name})=>{const item=document.createElement('label');item.className='habit-item';const cb=document.createElement('input');cb.type='checkbox';cb.checked=day(chosen).habits?.[id]===true;cb.addEventListener('change',()=>{const d={...day(chosen)};d.habits={...(d.habits||{}),[id]:cb.checked};state.days[chosen]=d;save();if(!$('history').classList.contains('hidden'))history()});const label=document.createElement('span');label.textContent=name;item.append(cb,label);container.append(item)})
}
function renderHabitEditor(){
 const container=$('habitEditor');container.replaceChildren();
 state.habitConfig.forEach((habit,i)=>{const line=document.createElement('div');line.className='habit-edit-row';
 const cb=document.createElement('input');cb.type='checkbox';cb.checked=habit.enabled;cb.setAttribute('aria-label',habit.name+' anzeigen');cb.addEventListener('change',()=>{habit.enabled=cb.checked;save();drawHabits();history()});
 const name=document.createElement('input');name.type='text';name.value=habit.name;name.maxLength=45;name.setAttribute('aria-label','Name für Tagesziel '+(i+1));name.addEventListener('change',()=>{habit.name=name.value.trim()||habit.name;name.value=habit.name;save();drawHabits();history()});
 const del=document.createElement('button');del.type='button';del.className='small-action';del.textContent='×';del.title='Tagesziel entfernen';del.setAttribute('aria-label',habit.name+' entfernen');del.addEventListener('click',()=>{if(!confirm('Dieses Tagesziel entfernen? Bisherige Häkchen bleiben in Backups erhalten.'))return;state.habitConfig=state.habitConfig.filter(x=>x!==habit);save();renderHabitEditor();drawHabits();history()});
 line.append(cb,name,del);container.append(line)})
 $('addHabit').disabled=state.habitConfig.length>=12
}
function drawHabitStats(days){
 const container=$('habitStats');container.replaceChildren();
 const shown=visibleHabits();$('habitStatsSection').classList.toggle('hidden',shown.length===0);
 shown.forEach(({id,name})=>{const count=days.filter(s=>day(s).habits?.[id]===true).length;const pct=Math.round(count/days.length*100);const card=document.createElement('div');card.className='habit-stat';const top=document.createElement('div');top.className='habit-stat-top';const label=document.createElement('strong');label.textContent=name;const value=document.createElement('span');value.className='count';value.textContent=`${count} / ${days.length}`;top.append(label,value);const meter=document.createElement('div');meter.className='habit-meter';const fill=document.createElement('div');fill.style.width=pct+'%';meter.append(fill);card.append(top,meter);container.append(card)})
}

function shift(n){let d=parse(chosen);d.setDate(d.getDate()+n);chosen=iso(d);draw();history()}$('prev').onclick=()=>shift(-1);$('next').onclick=()=>shift(1);$('date').onchange=e=>{if(e.target.value){chosen=e.target.value;draw();history()}};$('goal').onchange=e=>{let n=Math.round(Number(e.target.value));if(n>0){state.goal=n;save()}draw();history()};function tab(which){let h=which==='history';$('today').classList.toggle('hidden',h);$('history').classList.toggle('hidden',!h);$('tabToday').classList.toggle('active',!h);$('tabHistory').classList.toggle('active',h);if(h)history()}$('tabToday').onclick=()=>tab('today');$('tabHistory').onclick=()=>tab('history');$('week').onclick=()=>{period=7;history()};$('month').onclick=()=>{period=30;history()};function exportBackup(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='kalorien-sicherung-'+iso(new Date())+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000)}$('backupToday').onclick=exportBackup;function openRestore(){$('importFile').click()}$('restoreToday').onclick=openRestore;$('importFile').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let obj=JSON.parse(await f.text());if(!obj||!obj.days||typeof obj.days!=='object'||Array.isArray(obj.days)||!Number.isFinite(Number(obj.goal))||Number(obj.goal)<=0)throw Error();for(const [date,meals] of Object.entries(obj.days)){if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||!meals||typeof meals!=='object'||Array.isArray(meals))throw Error();for(const [key,value] of Object.entries(meals)){if(key==='habits'){if(!value||typeof value!=='object'||Array.isArray(value))throw Error();for(const [habitKey,checked] of Object.entries(value)){if(!/^[a-z0-9_-]{1,40}$/i.test(habitKey)||typeof checked!=='boolean')throw Error()}}else if(!labels.includes(key)||!Number.isFinite(Number(value))||Number(value)<0)throw Error()}}if(!confirm('Vorhandene Daten durch das Backup ersetzen?'))return;state={days:obj.days,goal:Number(obj.goal),habitConfig:cleanHabitConfig(obj.habitConfig)};save();draw();renderHabitEditor();history();alert('Sicherung erfolgreich wiederhergestellt.')}catch{alert('Ungültige Backup-Datei')}e.target.value=''};// KI-Kalorienschätzung: API-Schlüssel bleibt ausschließlich im Session-Speicher des Browsers.

  if(!response.ok){if(response.status===400||response.status===403)throw Error('API-Schlüssel oder API-Zugriff prüfen.');if(response.status===429)throw Error('API-Limit erreicht.');throw Error('KI-Dienst nicht erreichbar ('+response.status+').')}
  const json=await response.json();const txt=json.candidates?.[0]?.content?.parts?.map(p=>p.text||'').join('')||'';const estimate=JSON.parse(txt);const kcal=Math.round(Number(estimate.kcal));if(!Number.isFinite(kcal)||kcal<=0||kcal>20000)throw Error('Keine gültige Kalorienangabe erhalten.');

  const addLabel=document.createElement('label');addLabel.className='subtle';addLabel.textContent='Zur Mahlzeit hinzufügen:';const select=document.createElement('select');select.setAttribute('aria-label','Mahlzeit auswählen');labels.forEach(l=>{const o=document.createElement('option');o.value=l;o.textContent=l;select.append(o)});const add=document.createElement('button');add.type='button';add.textContent='+ '+fmt(kcal)+' kcal';add.onclick=()=>{const d={...day(chosen)};d[select.value]=Math.max(0,Number(d[select.value])||0)+kcal;state.days[chosen]=d;save();draw();result.append(document.createTextNode(' ✓ Eingetragen'));add.disabled=true};const row=document.createElement('div');row.className='ai-add-row';row.append(select,add);result.append(addLabel,row)
 }catch(err){result.textContent=err.name==='AbortError'?'Zeitüberschreitung. Bitte erneut versuchen.':err.message||'Schätzung derzeit nicht möglich.'}finally{$('foodSubmit').disabled=false;$('foodSubmit').textContent='Schätzen'}
